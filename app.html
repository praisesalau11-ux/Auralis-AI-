<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auralis AI</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0b0f1a">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("./sw.js")
            .then(() => console.log("Service Worker Registered"))
            .catch(console.error);
    });
}
</script>

</head>

<body>

<div class="app">

    <!-- ================= HEADER ================= -->

    <div class="header">

        <h1>Auralis AI</h1>

        <p id="userInfo">Loading...</p>

        <p id="planInfo">Plan: Free</p>

        <div id="upgradeBox"></div>

    </div>



    <!-- ================= CHAT ================= -->

    <div id="home" class="page">

        <div class="card">

            <div id="chatBox" class="chat-box"></div>

            <p id="status"></p>

            <div class="input-bar">

                <!-- Voice -->

                <button
                    class="mic-btn"
                    onmousedown="startHoldRecord()"
                    onmouseup="stopHoldRecord()"
                    ontouchstart="startHoldRecord()"
                    ontouchend="stopHoldRecord()"
                    title="Voice">

                    🎤

                </button>

                <!-- Upload -->

                <button
                    onclick="pickFile()"
                    title="Upload">

                    📎

                </button>

                <!-- Camera -->

                <button
                    onclick="takePhoto()"
                    title="Camera">

                    📷

                </button>

                <input
                    type="file"
                    id="fileInput"
                    hidden
                    accept="image/*,.pdf,.txt,.doc,.docx,.csv,.json,.js,.html,.css,.md"
                >

                <input
               <textarea
                id="textInput"
           placeholder="Ask anything..."
               rows="2"
               autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
               spellcheck="false">
               </textarea>
                 
                    
                

                <button onclick="sendMessage()">

                    ➤

                </button>

            </div>

            <div id="selectedFile"></div>

        </div>

    </div>



    <!-- ================= HISTORY ================= -->

    <div id="history" class="page hidden">

        <div class="card">

            <h2>Chats</h2>

            <button
                class="primary-btn"
                onclick="createNewChat()">

                ➕ New Chat

            </button>

            <div id="historyList"></div>

        </div>

    </div>



    <!-- ================= ANALYTICS ================= -->

    <div id="analytics" class="page hidden">

        <div class="card">

            <h2>📊 Analytics</h2>

            <div id="analyticsBox">

                <canvas id="usageChart"></canvas>

            </div>

        </div>

    </div>



    <!-- ================= SETTINGS ================= -->

    <div id="settings" class="page hidden">

        <div class="card">

            <h2>Settings</h2>

            <button
                class="danger-btn"
                onclick="logout()">

                Logout

            </button>

            <button
                class="upgrade-btn"
                onclick="window.open('https://paystack.shop/pay/j-1x5anvvc')">

                💳 Upgrade to Pro

            </button>

        </div>

    </div>

</div>



<!-- ================= NAVIGATION ================= -->

<div class="nav">

    <button onclick="openTab('home')">

        💬 Chat

    </button>

    <button onclick="openTab('history')">

        📁 History

    </button>

    <button onclick="openTab('analytics')">

        📊 Stats

    </button>

    <button onclick="openTab('settings')">

        ⚙️ Settings

    </button>

</div>



<script type="module" src="app.js"></script>

</body>
</html>
